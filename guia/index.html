<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía de Nordwind II</title>
<meta name="description" content="Guía del modpack de Nordwind II: qué hace cada mod, wikis y videos verificados.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..700&display=swap">
<!-- Solo se descargan los 15 íconos que usa la página (icon_names, en orden alfabético) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=apps,auto_fix_high,backpack,build,close,groups,left_panel_close,left_panel_open,menu,pets,public,restaurant,search,star,swords&display=block">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layers.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/transitions.css">
</head>
<body>
<a class="skip" href="#main">Ir al contenido</a>

<!-- Capa 1: video de fondo -->
<video class="layer-video" autoplay muted loop playsinline preload="auto" aria-hidden="true" tabindex="-1">
  <source src="assets/background.webm" type="video/webm; codecs=vp9">
  <source src="assets/background.mp4" type="video/mp4">
</video>
<!-- Capa 2: velo para legibilidad -->
<div class="layer-shade" aria-hidden="true"></div>

<!-- Capa 3: contenido -->

<div class="layer-content">
  <div class="shell" id="shell">
    <nav class="rail glass" aria-label="Buscar y filtrar por categoría">
      <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false" aria-controls="panel" aria-label="Abrir categorías"><span class="mi" aria-hidden="true">menu</span></button>
      <label class="search glass">
        <span class="sr-only">Buscar un mod o un tema</span>
        <span class="mi" aria-hidden="true">search</span>
        <input id="q" type="search" placeholder="Waystones" autocomplete="off">
      </label>
      <div class="panel" id="panel" role="group" aria-label="Categorías">
        <div class="panel-head">
          <span>Categorías</span>
          <button class="menu-btn" id="menuClose" type="button" aria-label="Cerrar categorías"><span class="mi" aria-hidden="true">close</span></button>
        </div>
        <button class="rail-toggle" id="railToggle" type="button" aria-expanded="true" aria-controls="chips">
          <span class="rail-title">Categorías<span class="now">: <strong id="railNow">Todo</strong></span></span>
          <span class="mi ic-panel" aria-hidden="true">left_panel_close</span>
        </button>
        <ul class="chips" id="chips"></ul>
      </div>
    </nav>

    <main id="main">
      <h1 class="sr-only">Guía de Nordwind II</h1>
      <p class="sr-only" id="count" role="status"></p>
      <div id="list"></div>
      <div class="empty" id="empty">
        <p id="emptyMsg"></p>
        <button type="button" id="clear">Borrar búsqueda y filtro</button>
      </div>
    </main>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/background.js"></script>
<script src="js/main.js"></script>
</body>
</html>
